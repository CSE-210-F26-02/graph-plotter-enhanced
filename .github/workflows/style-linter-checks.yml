name: Style linter checks

# Runs on every push (any branch) and every pull request, so a unformatted change or
# a linting error shows a red check before it reaches main.
on:
    push:
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
            - name: Install dependencies
              run: npm ci --ignore-scripts
            - name: Run style linter checks
              run: npm run lint
            - name: Run prettier checks
              run: npm run format-check
