name: Unit tests

# Runs on every push (any branch) and every pull request, so a broken change
# shows a red check before it reaches main.
on:
    push:
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        # If a change makes the app freeze (an infinite loop), fail fast instead of hanging for hours.
        timeout-minutes: 5
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
            # No npm install needed: the tests use Node's built-in test runner and have no dependencies.
            - name: Run unit tests
              run: npm test
